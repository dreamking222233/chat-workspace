services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chat_workspace
      MYSQL_USER: chat_app
      MYSQL_PASSWORD: local_chat_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - chat_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chat_mysql_data:
